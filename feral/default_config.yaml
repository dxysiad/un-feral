run_name: new_run
backbone: vjepa2_vitl_diving48
predict_per_item: 1      # the encoder emits one vector per chunk (kept so existing configs/checkpoints still load)
output_dir: null  # root for results (checkpoints/, embeddings/, wandb/). null = current directory.
dataset: null            # optional name nesting results one level deeper, e.g. checkpoints/<dataset>/
model:
  embed_dim: 256          # dimension of the per-chunk embedding the MLP projects into
  mlp_hidden_dim: null    # hidden width of the MLP projection head (null = backbone hidden_dim)
  freeze_encoder_layers: 12
  gradient_checkpointing: false   # activation checkpointing: ~25-30% slower, big VRAM cut (fits ViT-L in ~9GB bs4). V-JEPA 2 / 2.1 only; errors on VideoPrism.
data:
  splits_file: null        # optional JSON listing video filenames per partition (train/val/test/inference), no labels. null = auto-split the folder.
  split_ratios: [0.9, 0.05, 0.05]   # train/val/test fractions used when splits_file is null
  chunk_length: 64
  chunk_shift: 32
  chunk_step: 1
  target_fps: null         # normalize sampling to ~this fps per video by widening chunk_step/chunk_shift by round(source_fps / target_fps) (>=1; decimate only, can't upsample). chunk_length is unchanged, so a chunk covers the same real-time window regardless of source frame rate. null = use raw frames (no fps normalization). Lets 30 Hz and 100 Hz videos train/infer together consistently.
  vid2_max_shift: 16        # vid2's start is jittered +/- this many frames from vid1's (50% of the time). Larger = the model must tolerate more temporal offset between positives; 0 = vid2 is the same frames as vid1.
  neg_same_video_frac: 0.0 # fraction of triplets whose negative (vid3) is drawn from the SAME video as the anchor instead of anywhere in the corpus. 0 = always corpus-wide (original behavior). Raise to ~0.75-0.8 when the embedding clusters by recording session/environment rather than behavior: a same-video negative shares the anchor's background, so the model can't use background as a shortcut and must key on motion/behavior.
  eval_chunk_shift: null   # stride between chunks for the inference partition only (null = reuse chunk_shift). Lets embedding extraction run a denser overlap than training.
  resize_to: 256
  resize_style: square
  do_aa: true
training:
  epochs: 10               # number of contrastive training epochs
  train_bs: 4
  val_bs: 8
  num_workers: -1   # -1 = auto: min(16, CPUs available to the process); 0 = main process; or pin a positive int
  part_warmup: 0.2
  lr: 4.0e-5
  weight_decay: 0.1
  compile: true
  patience: null
  grad_clip_norm: null     # global grad-norm clip (null = off; e.g. 1.0 to stabilize runs)
  log_grad_norm: true      # log global grad-norm every step even when not clipping (cheap)
  contrastive_num_samples: 2000       # triplets sampled per training epoch
  contrastive_val_num_samples: 300    # triplets sampled for each val/test evaluation
  contrastive_lr: 4.0e-5   # training learning rate (defaults to `lr` if omitted)
  contrastive_margin: 1.0  # triplet hinge margin (passed to contrastive_step)
seed: 0
device: "cuda"
starting_checkpoint: null
max_batches: null
