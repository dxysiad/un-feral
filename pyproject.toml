[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feral"
version = "1.0.0"
description = "FERAL: Feature Extraction for Recognition of Animal Locomotion"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "torch>=2.5.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "decord==0.6.0; sys_platform == 'linux'",
    "eva-decord==0.6.0; sys_platform == 'darwin'",
    "triton-windows>=3.0; sys_platform == 'win32'",
    "transformers==5.5.3",
    "wandb==0.25.1",
    "timm==1.0.26",
    "einops==0.8.2",
    "hf_xet==1.4.3",
    "opencv-python-headless==5.0.0.93",   # headless: feral only uses VideoCapture/CAP_PROP_*/BORDER_REPLICATE (no GUI). albumentations also requires headless; pinning the full opencv-python here installed a second cv2 that clobbered this one.
    "matplotlib==3.10.8",
    "hf_transfer==0.1.9",
    "albumentations==2.0.8",
]

[project.urls]
Homepage = "https://getferal.ai"
Repository = "https://github.com/Skovorp/feral"

[project.scripts]
feral = "feral.cli:main"

[tool.setuptools.packages.find]
include = ["feral*"]

[tool.setuptools.package-data]
feral = ["default_config.yaml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
feral = { path = ".", editable = true }
torch = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
umap-learn = ">=0.5"
pytest = ">=9.1.1,<10"   # test-only; kept out of [project.dependencies] so it isn't a runtime dep of the published package

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"   # unpinned, pixi resolves to the newest CPython, which drifts the whole stack; 3.11 also matches requires-python >=3.10 far better than 3.14 does
numpy = "<2.5"      # numba (via umap-learn) requires numpy<2.5; redundant on 3.11 (numpy 2.5 ships no cp311 wheels) but guards a future python bump
black = ">=26.5.1,<27"
jupyter = ">=1.1.1,<2"
jupyterlab = ">=4.6.1,<5"
ipykernel = ">=7.3.0,<8"
pip = ">=26.1.2,<27"
notebook = ">=7.6.0,<8"
gdown = ">=6.1.0,<7"
setuptools = ">=82.0.1,<83"
python-dotenv = ">=1.2.2,<2"
envyaml = ">=1.10.211231,<2"
fastapi = ">=0.139.0,<0.140"
